<style>.bg{fill:#0d1117;stroke:#30363d}.panel{fill:#161b22;stroke:#30363d}.chip{fill:#21262d;stroke:#30363d}.win{fill:#010409;stroke:#30363d}.bar{fill:#161b22}.txt{fill:#e6edf3}.mut{fill:#8b949e}.acc{fill:#4493f8}.dot{fill:#21262d}.kw{fill:#ff7b72}.vr{fill:#79c0ff}.st{fill:#a5d6ff}.track{fill:#21262d}.gs{stop-color:#4493f8}.ln{stroke:#30363d}@media (prefers-color-scheme: light){.bg{fill:#ffffff;stroke:#d0d7de}.panel{fill:#f6f8fa;stroke:#d0d7de}.chip{fill:#ffffff;stroke:#d0d7de}.win{fill:#ffffff;stroke:#d0d7de}.bar{fill:#f6f8fa}.txt{fill:#1f2328}.mut{fill:#656d76}.acc{fill:#0969da}.dot{fill:#d8dee4}.kw{fill:#cf222e}.vr{fill:#0550ae}.st{fill:#0a3069}.track{fill:#e6eaef}.gs{stop-color:#0969da}.ln{stroke:#d0d7de}}@keyframes b{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:b 1.1s steps(1) infinite}</style>
